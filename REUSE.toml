# SPDX-License-Identifier: AGPL-3.0-or-later
# Licence and copyright of files that cannot carry a header (REUSE specification 3.3).
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the starterpack contributors"

[[annotations]]
path = ["**/*.md", "**/.gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the starterpack contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Templates carry placeholders such as {{licence}} in their SPDX headers – their own headers are not read. Licence
# texts in templates/LICENSES/ are skipped by REUSE like any LICENSES folder.
[[annotations]]
path = "templates/**"
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the starterpack contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "templates/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright © 2017 IBM Corp. with Reserved Font Name \"Plex\""
SPDX-License-Identifier = "OFL-1.1"
