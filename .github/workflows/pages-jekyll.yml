# SPDX-License-Identifier: AGPL-3.0-or-later
# Reusable: a folder built with Jekyll as GitHub Pages builds it (remote theme Just the Docs) and published with
# GitHub Actions – never from a branch. The caller grants `pages: write` and `id-token: write` and sets the domain in
# Settings → Pages (no CNAME file needed). Projects call it pinned by commit:
#   uses: falkoss/starterpack/.github/workflows/pages-jekyll.yml@<commit>
#   with: { source: docs }
# With publish: false it only builds (pull requests, checks). Actions are pinned by commit, with the version as a
# comment. Taken over from kernoid's pages.yml.
name: Pages (Jekyll)

on:
  workflow_call:
    inputs:
      source:
        description: the folder Jekyll builds
        type: string
        default: docs
      publish:
        description: publish the build to GitHub Pages
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: inputs.publish
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./${{ inputs.source }}
          destination: ./_site
      - if: inputs.publish
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
