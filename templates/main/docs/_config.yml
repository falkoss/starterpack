# SPDX-License-Identifier: {{licence}}
# The {{name}} documentation at {{docs_domain}}, built from this folder with Jekyll and the remote theme Just the Docs
# by .github/workflows/pages.yml (GitHub Actions, not a branch). The files in assets/ are copies from {{name}}/brand.
title: {{name}}
description: {{tagline}} – documentation
url: https://{{docs_domain}}
lang: en

remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme

color_scheme: {{name}}
logo: /assets/{{name}}-lockup-on-dark.svg
favicon_ico: /assets/favicon.ico
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  {{main_domain}}: https://{{main_domain}}
  GitHub: https://github.com/{{name}}/{{name}}
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/{{name}}/{{name}}
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: "{{name}} is free software under {{licence}} – a <a href=\"https://falkoss.org\">falkOSS</a> project. <a href=\"https://falkoss.org/impressum.html\">Imprint</a> · <a href=\"https://falkoss.org/datenschutz.html\">Privacy</a>"

# Every page uses the theme's layout (GitHub Pages would default to it as well; a local build does not)
defaults:
  - scope:
      path: ""
    values:
      layout: default
