# SPDX-License-Identifier: {{licence}}
# Licence and copyright of files that cannot carry a header (REUSE specification 3.3). Source files name their own
# licence in an SPDX header.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "{{publisher}} and the {{name}} contributors"

[[annotations]]
path = ["**/*.md", "**/.gitignore", "brand/svg/**", "brand/png/**", "brand/web/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "{{publisher}} and the {{name}} contributors"
SPDX-License-Identifier = "{{licence}}"
