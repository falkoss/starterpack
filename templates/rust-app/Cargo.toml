# SPDX-License-Identifier: {{licence}}
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "{{licence}}"
repository = "https://github.com/{{name}}/{{name}}"
publish = false

# Exact versions, each the newest that is at least 14 days old (scripts/check-age.py).
[workspace.dependencies]
{{name}}-api = { path = "crates/{{name}}-api" }
{{name}}-app = { path = "crates/{{name}}-app" }
{{name}}-core = { path = "crates/{{name}}-core" }
{{name}}-store = { path = "crates/{{name}}-store" }
{{name}}-tui = { path = "crates/{{name}}-tui" }
anyhow = "=1.0.104"
axum = "=0.8.9"
clap = { version = "=4.6.7", features = ["derive"] }
http-body-util = "=0.1.5"
ratatui = "=0.30.2"
rust-embed = { version = "=8.13.0", features = ["mime-guess"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "=0.5.3", features = ["util"] }
utoipa = { version = "=6.0.0", features = ["axum_extras"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
