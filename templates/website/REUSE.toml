# SPDX-License-Identifier: AGPL-3.0-or-later
# Licence and copyright of files that cannot carry a header (REUSE specification 3.3).
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "{{publisher}} and the {{name}} contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Copies of the artwork from {{name}}/brand – kept as they are, under its licence.
[[annotations]]
path = ["favicon.*", "apple-touch-icon.png", "icon-*.png", "site.webmanifest", "social.png", "assets/**"]
precedence = "override"
SPDX-FileCopyrightText = "{{publisher}}"
SPDX-License-Identifier = "CC-BY-ND-4.0"
