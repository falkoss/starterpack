# SPDX-License-Identifier: AGPL-3.0-or-later
# The licence check (REUSE) and a sign-off (DCO) on every commit of a pull request – both from falkoss/starterpack,
# pinned by commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licences:
    uses: falkoss/starterpack/.github/workflows/reuse.yml@{{starterpack_rev}}
  sign-off:
    uses: falkoss/starterpack/.github/workflows/dco.yml@{{starterpack_rev}}
